name: GHCR Cleanup

# Räumt verwaiste sha256-Versionen im GHCR-Paket auf (Plattform-Images und
# Attestations von gelöschten Tags). Die Action kennt Multi-Arch-Manifeste und
# lässt alles stehen, was von einem getaggten Image referenziert wird.

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Nur anzeigen, nichts löschen"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: entityguard
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
