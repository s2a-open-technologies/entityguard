version: '3.8'

services:
  entityguard:
    build: .
    container_name: entityguard
    ports:
      - "9500:9500"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - entityguard-network

networks:
  entityguard-network:
    driver: bridge
