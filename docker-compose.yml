version: '3.8'

services:
  guardrails:
    build: .
    container_name: medical-chat-sanitizer
    ports:
      - "6000:6000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - guardrails-network

networks:
  guardrails-network:
    driver: bridge
