[project]
name = "entityguard"
version = "1.0.0"
description = "EntityGuard - Security layer for anonymizing patient data according to GDPR and HIPAA regulations"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Christopher Abanilla" }
]
dependencies = [
    "fastapi>=0.135.1",
    "presidio>=2.2.361",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "jinja2>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "spacy>=3.8.11",
    "de_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
