<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} - EntityGuard</title>
    <link rel="stylesheet" href="{{ asset_url('css/admin.css') }}">
</head>
<body>
    <div class="app-shell">
        {% if user %}
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>EntityGuard</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin/dashboard" class="nav-item {% if request.url.path == '/admin/dashboard' %}active{% endif %}">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                    Dashboard
                </a>
                <a href="/sanitize" class="nav-item {% if request.url.path == '/sanitize' %}active{% endif %}">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 3a8 8 0 0 0-8 8c0 4.4 3.6 8 8 8h4a2 2 0 0 0 2-2v-4a8 8 0 0 0-8-10z"/>
                        <path d="M12 8v5"/>
                        <circle cx="12" cy="6.5" r="0.5" fill="currentColor"/>
                        <path d="M16 12l3 3-3 3"/>
                    </svg>
                    Text anonymisieren
                </a>
                <a href="/admin/entities" class="nav-item {% if '/admin/entities' in request.url.path %}active{% endif %}">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 7h.01M7 3h5c1.133 0 2.2.534 2.868 1.434l4 6c1.072 1.607.844 3.73-.548 5.123l-2.863 2.863c-1.393 1.392-3.516 1.62-5.123.548l-6-4C3.534 14.2 3 13.133 3 12V7a4 4 0 0 1 4-4z"/>
                    </svg>
                    Entitäten
                </a>
                <a href="/admin/modelle" class="nav-item {% if '/admin/modelle' in request.url.path %}active{% endif %}">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                        <rect x="9" y="9" width="6" height="6"/>
                        <line x1="9" y1="1" x2="9" y2="4"/>
                        <line x1="15" y1="1" x2="15" y2="4"/>
                        <line x1="9" y1="20" x2="9" y2="23"/>
                        <line x1="15" y1="20" x2="15" y2="23"/>
                        <line x1="20" y1="9" x2="23" y2="9"/>
                        <line x1="20" y1="14" x2="23" y2="14"/>
                        <line x1="1" y1="9" x2="4" y2="9"/>
                        <line x1="1" y1="14" x2="4" y2="14"/>
                    </svg>
                    Modelle
                </a>
                <a href="/admin/allowlist" class="nav-item {% if '/admin/allowlist' in request.url.path %}active{% endif %}">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    Ausnahmeliste
                </a>
                <a href="/admin/howto" class="nav-item {% if request.url.path == '/admin/howto' %}active{% endif %}">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        <line x1="10" y1="7" x2="15" y2="7"/>
                        <line x1="10" y1="11" x2="15" y2="11"/>
                    </svg>
                    Anleitung
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-menu">
                    <span class="username">{{ user.username }}</span>
                    <div class="user-menu-links">
                        <a href="/admin/profile/password">Passwort ändern</a>
                        <a href="/admin/logout">Abmelden</a>
                    </div>
                </div>
            </div>
        </aside>
        {% endif %}
        <main class="content {% if not user %}no-sidebar{% endif %} {% block content_class %}{% endblock %}">
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="alert alert-success">{{ success }}</div>
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ asset_url('js/admin.js') }}"></script>
</body>
</html>
